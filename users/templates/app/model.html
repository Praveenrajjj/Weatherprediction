}

.form-wrap:before {

  top: 10px;
  left: 10px;
  right: 10px;
  bottom: 10px;
  background: linear-gradient(145deg, #002f94, #002f94);

.form-group {

.form-control {

.form-control:focus {

}

textarea.form-control {

.btn {

  color: white;
  border-radius: 5px;
  text-decoration: none;
  text-transform: uppercase;
  font-weight: bold;
  transition: transform 0.3s ease;
  perspective: 1000px; /* Setting perspective for 3D effect */

}

.btn-primary {

  background-color: #002f94;
  border: none;
}

.btn-primary:hover {
  color: #002f94;
  background-color: #ffffff;
  border: 1px solid #002f94;
  box-shadow: 0px 0px 10px rgba(0, 47, 148, 0.3);
}
